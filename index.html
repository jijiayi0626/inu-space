<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="INU 账号中心 · 一个账号，管理你的全部服务" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111113'/%3E%3Cpath d='M10 22V10h2.6v12H10zm5.4 0V10h2.4l4.2 7.2V10H24v12h-2.4l-4.2-7.2V22h-2z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <title>INU 账号中心</title>
    <script>
      ;(function () {
        var mode = 'light'
        try {
          var saved = localStorage.getItem('inu-theme')
          if (saved === 'light' || saved === 'dark') mode = saved
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) mode = 'dark'
        } catch (e) {
          try {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) mode = 'dark'
          } catch (e2) {}
        }
        document.documentElement.setAttribute('data-theme', mode)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
